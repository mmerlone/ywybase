  '@humanfs/node': 0.16.8
  brace-expansion@^1.1.0: 1.1.18
  brace-expansion@^2.0.0: 2.1.4
  brace-expansion@^5.0.0: 5.0.9
  eslint-plugin-react-hooks: 7.1.1
  fast-uri: 3.1.6
